<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420" role="img" aria-labelledby="title desc">
  <title id="title">AWS Cloud — Event-Driven Pipeline Architecture</title>
  <desc id="desc">IoT Core Greengrass → Kinesis Streams → EKS Isolated Pods → EventBridge → Aurora Storage and SNS Alerts. Polyline connections.</desc>
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- White canvas -->
  <rect width="1080" height="420" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- AWS Cloud group — light, dashed -->
  <rect x="16" y="16" width="1048" height="388" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="10 7"/>
  <rect x="16" y="16" width="1048" height="388" rx="18" fill="none" stroke="#94a3b8" stroke-width="0.6" stroke-dasharray="3 6" opacity="0.35"/>

  <!-- AWS Cloud label -->
  <g transform="translate(30,28)">
    <rect x="0" y="0" width="126" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="9" y="7" width="10" height="10" rx="2" fill="#FF9900"/>
    <text x="24" y="16.5" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" letter-spacing="0.06em" fill="#0f172a">AWS Cloud</text>
  </g>
  <text x="1048" y="40" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8" letter-spacing="0.05em">architecture-beta</text>

  <!-- Card style: white cards, soft border, subtle shadow -->
  <!-- IoT -->
  <g filter="url(#softShadow)">
    <rect x="36" y="68" width="162" height="108" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="36" y="68" width="162" height="26" rx="14" fill="#f1f5f9"/>
    <rect x="36" y="80" width="162" height="14" fill="#f1f5f9"/>
    <text x="117" y="85" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="600" letter-spacing="0.10em" fill="#64748b">SERVER</text>
    <g transform="translate(89,102)">
      <rect x="0" y="0" width="26" height="26" rx="7" fill="#FFF7ED" stroke="#FF9900" stroke-width="1.1"/>
      <text x="13" y="18" text-anchor="middle" font-size="13" fill="#FF9900">◉</text>
    </g>
    <text x="117" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="650" fill="#0f172a">IoT Core</text>
    <text x="117" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#475569">Greengrass</text>
  </g>
  <circle cx="198" cy="122" r="3" fill="#334155" stroke="#ffffff" stroke-width="1.1"/>
  <!-- Kinesis -->
  <g filter="url(#softShadow)">
    <rect x="236" y="68" width="162" height="108" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="236" y="68" width="162" height="26" rx="14" fill="#f1f5f9"/>
    <rect x="236" y="80" width="162" height="14" fill="#f1f5f9"/>
    <text x="317" y="85" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="600" letter-spacing="0.10em" fill="#64748b">SERVER</text>
    <g transform="translate(289,102)">
      <rect x="0" y="0" width="26" height="26" rx="7" fill="#FFF7ED" stroke="#FF9900" stroke-width="1.1"/>
      <text x="13" y="18" text-anchor="middle" font-size="13" fill="#FF9900">≋</text>
    </g>
    <text x="317" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="650" fill="#0f172a">Kinesis</text>
    <text x="317" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#475569">Streams</text>
  </g>
  <circle cx="236" cy="122" r="3" fill="#94a3b8" stroke="#ffffff" stroke-width="1.1"/>
  <circle cx="398" cy="122" r="3" fill="#334155" stroke="#ffffff" stroke-width="1.1"/>

  <!-- EKS -->
  <g filter="url(#softShadow)">
    <rect x="436" y="68" width="162" height="108" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="436" y="68" width="162" height="26" rx="14" fill="#f1f5f9"/>
    <rect x="436" y="80" width="162" height="14" fill="#f1f5f9"/>
    <text x="517" y="85" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="600" letter-spacing="0.10em" fill="#64748b">SERVER</text>
    <g transform="translate(489,102)">
      <rect x="0" y="0" width="26" height="26" rx="7" fill="#FFF7ED" stroke="#FF9900" stroke-width="1.1"/>
      <text x="13" y="18" text-anchor="middle" font-size="13" fill="#FF9900">⬢</text>
    </g>
    <text x="517" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="650" fill="#0f172a">EKS Isolated</text>
    <text x="517" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#475569">Pods</text>
  </g>
  <circle cx="436" cy="122" r="3" fill="#94a3b8" stroke="#ffffff" stroke-width="1.1"/>
  <circle cx="598" cy="122" r="3" fill="#334155" stroke="#ffffff" stroke-width="1.1"/>

  <!-- EventBridge - hub accent -->
  <g filter="url(#softShadow)">
    <rect x="636" y="68" width="162" height="108" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="1.4"/>
    <rect x="636" y="68" width="162" height="26" rx="14" fill="#0f172a"/>
    <rect x="636" y="80" width="162" height="14" fill="#0f172a"/>
    <text x="717" y="85" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700" letter-spacing="0.09em" fill="#ffffff">HUB • SERVER</text>
    <g transform="translate(689,102)">
      <rect x="0" y="0" width="26" height="26" rx="7" fill="#FF9900" stroke="#FF9900" stroke-width="1"/>
      <text x="13" y="18" text-anchor="middle" font-size="13" fill="#ffffff">⬡</text>
    </g>
    <text x="717" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">EventBridge</text>
    <text x="717" y="160" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#64748b">event bus</text>
  </g>
  <circle cx="636" cy="122" r="3" fill="#94a3b8" stroke="#ffffff" stroke-width="1.1"/>
  <circle cx="798" cy="122" r="3" fill="#334155" stroke="#ffffff" stroke-width="1.1"/>
  <circle cx="717" cy="176" r="3" fill="#334155" stroke="#ffffff" stroke-width="1.1"/>

  <!-- SNS -->
  <g filter="url(#softShadow)">
    <rect x="862" y="68" width="162" height="108" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="862" y="68" width="162" height="26" rx="14" fill="#f1f5f9"/>
    <rect x="862" y="80" width="162" height="14" fill="#f1f5f9"/>
    <text x="943" y="85" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="600" letter-spacing="0.10em" fill="#64748b">SERVER</text>
    <g transform="translate(915,102)">
      <rect x="0" y="0" width="26" height="26" rx="7" fill="#FFF7ED" stroke="#FF9900" stroke-width="1.1"/>
      <text x="13" y="18" text-anchor="middle" font-size="12" fill="#FF9900">✉</text>
    </g>
    <text x="943" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="650" fill="#0f172a">SNS</text>
    <text x="943" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#475569">Alerts</text>
  </g>
  <circle cx="862" cy="122" r="3" fill="#94a3b8" stroke="#ffffff" stroke-width="1.1"/>

  <!-- Aurora -->
  <g filter="url(#softShadow)">
    <rect x="636" y="248" width="162" height="108" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="636" y="248" width="162" height="26" rx="14" fill="#EFF6FF"/>
    <rect x="636" y="260" width="162" height="14" fill="#EFF6FF"/>
    <text x="717" y="265" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="600" letter-spacing="0.10em" fill="#2563eb">DATABASE</text>
    <g transform="translate(689,282)">
      <rect x="0" y="0" width="26" height="26" rx="7" fill="#EFF6FF" stroke="#2563eb" stroke-width="1.1"/>
      <text x="13" y="18" text-anchor="middle" font-size="13" fill="#2563eb">▦</text>
    </g>
    <text x="717" y="326" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="650" fill="#0f172a">Aurora</text>
    <text x="717" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#475569">Storage</text>
  </g>
  <circle cx="717" cy="248" r="3" fill="#94a3b8" stroke="#ffffff" stroke-width="1.1"/>

  <!-- Polyline connections — thin, slate -->
  <polyline points="198,122 217,122 236,122" fill="none" stroke="#334155" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowLight)" opacity="0.95"/>
  <polyline points="398,122 417,122 436,122" fill="none" stroke="#334155" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowLight)" opacity="0.95"/>
  <polyline points="598,122 617,122 636,122" fill="none" stroke="#334155" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowLight)" opacity="0.95"/>
  <polyline points="798,122 830,122 862,122" fill="none" stroke="#334155" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowLight)" opacity="0.95"/>
  <polyline points="717,176 717,212 717,248" fill="none" stroke="#334155" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowLight)" opacity="0.95"/>

  <!-- subtle port labels -->
  <g font-family="JetBrains Mono, monospace" font-size="7.5" fill="#94a3b8" letter-spacing="0.03em">
    <text x="217" y="113" text-anchor="middle">R → L</text>
    <text x="417" y="113" text-anchor="middle">R → L</text>
    <text x="617" y="113" text-anchor="middle">R → L</text>
    <text x="830" y="113" text-anchor="middle">R → L</text>
    <text x="730" y="216" text-anchor="middle">B → T</text>
  </g>

  <text x="1042" y="392" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="7.5" fill="#94a3b8">polyline • AWS icons • light theme</text>
</svg>
